[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-strategy-lab"
version = "0.1.0"
description = "Data-first quantitative research archive and tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ZK" }
]
dependencies = [
  "duckdb>=1.2.0",
  "jsonschema>=4.26.0",
  "exchange-calendars>=4.13.2",
  "numpy>=2.2.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "pyyaml>=6.0.2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.26.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]
ml = [
  "lightgbm>=4.6.0",
  "scikit-learn>=1.6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"strategy_lab.knowledge" = ["*.json"]
