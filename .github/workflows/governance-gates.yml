name: Governance gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked test dependencies
        run: uv sync --locked --extra dev --extra ml
      - name: Run governance preflight
        run: uv run --locked --extra dev --extra ml python scripts/governance/preflight.py --governance-only
      - name: Run ruff
        run: uv run --locked --extra dev --extra ml ruff check src tests scripts/governance
      - name: Run tests that do not need local data
        run: uv run --locked --extra dev --extra ml pytest -q -m "not local_data"
